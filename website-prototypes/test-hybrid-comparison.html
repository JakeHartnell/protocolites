<!DOCTYPE html>
<html>
<head>
    <title>Hybrid Renderer Comparison Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #f0f0f0;
        }
        .container {
            display: flex;
            gap: 40px;
            margin-bottom: 40px;
        }
        .renderer {
            background: white;
            padding: 20px;
            border: 2px solid #333;
            flex: 1;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
        }
        .preview {
            width: 400px;
            height: 400px;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }
        .info {
            margin-top: 20px;
            font-size: 12px;
            background: #f8f8f8;
            padding: 10px;
            border: 1px solid #ddd;
        }
        iframe {
            width: 600px;
            height: 600px;
            transform: scale(0.666);
            transform-origin: 0 0;
            border: none;
        }
        svg {
            max-width: 100%;
            max-height: 100%;
        }
    </style>
</head>
<body>
    <h1>Hybrid Renderer Comparison</h1>
    <p>Testing with DNA: <code id="dnaDisplay"></code></p>

    <div class="container">
        <div class="renderer">
            <h2>JavaScript Renderer (animation_url)</h2>
            <div class="preview">
                <iframe id="jsRenderer"></iframe>
            </div>
            <div class="info" id="jsInfo">
                <p>Random sequence: <span id="jsRandom"></span></p>
                <p>Eye count: <span id="jsEyes"></span></p>
                <p>Arm count: <span id="jsArms"></span></p>
                <p>Leg count: <span id="jsLegs"></span></p>
            </div>
        </div>

        <div class="renderer">
            <h2>SVG Renderer (image)</h2>
            <div class="preview" id="svgPreview">
                Loading...
            </div>
            <div class="info" id="svgInfo">
                <p>Expected random sequence (calculated)</p>
            </div>
        </div>
    </div>

    <div>
        <button onclick="testNewDNA()">Test Random DNA</button>
        <button onclick="testSpecificDNA()">Test Specific DNA</button>
    </div>

    <script>
        // Test DNA
        let testDna = "0x1234567890abcdef";
        let isKid = false;
        let size = 24;

        function hashCode(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) {
                h = ((h << 5) - h) + s.charCodeAt(i);
                h &= h;
            }
            return Math.abs(h);
        }

        function simulateRandom(dna) {
            let seed = hashCode(dna);
            const results = [];

            // Simulate the same sequence as renderer
            function random() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }

            // Eye count
            const eyeCount = 1 + Math.floor(random() * 3);
            results.push(`Eyes: ${eyeCount}`);

            // Skip eye-specific randoms
            if (!isKid) {
                random(); // Adult has extra random for eye type
            }

            // Mouth (70% chance)
            const hasMouth = random() > 0.3;
            results.push(`Mouth: ${hasMouth}`);
            if (hasMouth) {
                random(); // left extension
                random(); // right extension
            }

            // Arms
            const armCount = 1 + Math.floor(random() * 4);
            const armLength = isKid ? (1 + Math.floor(random() * 2)) : (2 + Math.floor(random() * 4));
            results.push(`Arms: ${armCount} (length ${armLength})`);

            // Legs
            const legCount = 1 + Math.floor(random() * 4);
            const legLength = isKid ? (1 + Math.floor(random() * 2)) : (2 + Math.floor(random() * 3));
            results.push(`Legs: ${legCount} (length ${legLength})`);

            return results;
        }

        function generateJSRenderer() {
            const html = `
<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
        }
        .creature-container {
            position: relative;
            font-family: 'Courier New', monospace;
            line-height: 1;
        }
        .creature-char {
            position: absolute;
            font-family: 'Courier New', monospace;
            white-space: pre;
        }
    </style>
</head>
<body>
    <div class="creature-container" id="creature"></div>
    <script>
        const tokenId = 1;
        const dna = "${testDna}";
        const isKid = ${isKid};
        const parentDna = "0x0000000000000000";
        const size = ${size};
    <\/script>
    <script src="/renderer-v3.js"><\/script>
</body>
</html>`;

            document.getElementById('jsRenderer').srcdoc = html;
        }

        function generateSVGRenderer() {
            // This would call the Solidity function, but for now we'll simulate
            document.getElementById('svgPreview').innerHTML = `
                <p>Would display SVG from Solidity generateSVG() function</p>
                <p>DNA: ${testDna}</p>
            `;
        }

        function testNewDNA() {
            // Generate random DNA
            testDna = '0x' + Array.from({length: 16}, () =>
                Math.floor(Math.random() * 16).toString(16)
            ).join('');

            document.getElementById('dnaDisplay').textContent = testDna;

            // Show expected random sequence
            const results = simulateRandom(testDna);
            document.getElementById('jsInfo').innerHTML = '<p>' + results.join('</p><p>') + '</p>';

            generateJSRenderer();
            generateSVGRenderer();
        }

        function testSpecificDNA() {
            testDna = "0x1234567890abcdef";
            document.getElementById('dnaDisplay').textContent = testDna;

            const results = simulateRandom(testDna);
            document.getElementById('jsInfo').innerHTML = '<p>' + results.join('</p><p>') + '</p>';

            generateJSRenderer();
            generateSVGRenderer();
        }

        // Initial test
        testSpecificDNA();
    </script>
</body>
</html>
